<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>諮商所備考筆記</title>
<style>
:root {
  --accent: #2869e6;
  --accent-light: #e8f0fe;
  --border: #e1e4e8;
  --text: #24292e;
  --text-muted: #586069;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.login-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-box {
  background: #fff;
  border-radius: 12px;
  padding: 48px 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  max-width: 360px;
  width: 100%;
  margin: 20px;
}

.login-box h1 {
  font-size: 28px;
  margin-bottom: 8px;
  color: var(--text);
}

.login-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 32px;
  line-height: 1.5;
}

.login-form-group {
  margin-bottom: 20px;
}

.login-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text);
}

.login-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  box-sizing: border-box;
  transition: all .2s;
}

.login-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.login-btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}

.login-btn:hover:not(:disabled) {
  background: #1a56d4;
}

.login-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.login-error {
  color: #d32f2f;
  font-size: 13px;
  margin-top: 8px;
  display: none;
  padding: 8px;
  background: #ffebee;
  border-radius: 4px;
}

.login-error.show {
  display: block;
}

.login-success {
  color: #2e7d32;
  font-size: 13px;
  margin-top: 8px;
  display: none;
  padding: 8px;
  background: #e8f5e9;
  border-radius: 4px;
}

.login-success.show {
  display: block;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <h1>📚 諮商所備考筆記</h1>
    <p class="login-subtitle">研究所入學考試 · 上課筆記整理</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="login-form-group">
        <label class="login-label" for="password">密碼</label>
        <input
          type="password"
          id="password"
          class="login-input"
          placeholder="請輸入密碼"
          autocomplete="off"
          autofocus
        >
        <div class="login-error" id="loginError">❌ 密碼錯誤，請重試</div>
        <div class="login-success" id="loginSuccess">✓ 密碼正確，導入中...</div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">進入筆記</button>
    </form>
  </div>
</div>

<script>
// Generate default password based on today's date (MMDD format)
function getDefaultPassword() {
  const now = new Date();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return month + day;
}

// Handle login form submission
function handleLogin(event) {
  event.preventDefault();

  const passwordInput = document.getElementById('password');
  const errorMsg = document.getElementById('loginError');
  const successMsg = document.getElementById('loginSuccess');
  const loginBtn = document.getElementById('loginBtn');
  const defaultPass = getDefaultPassword();

  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');

  if (passwordInput.value === defaultPass) {
    // Save authentication state to localStorage
    localStorage.setItem('counselorPathAuth', 'true');
    successMsg.classList.add('show');
    loginBtn.disabled = true;

    // Redirect to notes page after 1 second
    setTimeout(() => {
      window.location.href = './notes.html';
    }, 1000);
  } else {
    errorMsg.classList.add('show');
    passwordInput.value = '';
    passwordInput.focus();
  }
}

// Check if already authenticated, redirect to notes page
window.addEventListener('load', function() {
  if (localStorage.getItem('counselorPathAuth') === 'true') {
    window.location.href = './notes.html';
  }
});

// Allow Enter key to submit form
document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
  }
});
</script>

</body>
</html>
