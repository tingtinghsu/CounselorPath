  height: var(--header-height);
  background: var(--accent);
  display: flex; align-items: center; padding: 0 20px;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}

  color: #fff; font-size: 18px; font-weight: 600; letter-spacing: .3px;
}
.header-sub {
  color: rgba(255,255,255,.75); font-size: 13px; margin-left: 12px;
}

/* ── Layout ── */
.layout {
  display: flex;
  margin-top: var(--header-height);
  min-height: calc(100vh - var(--header-height));
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: var(--header-height);
  height: calc(100vh - var(--header-height));
  overflow-y: auto;
}

.sidebar-subject {
  margin-bottom: 6px;
}
.sidebar-subject-header {
  display: flex; align-items: center;
  padding: 8px 20px;
  cursor: pointer;
  user-select: none;
  gap: 8px;
}
.sidebar-subject-header:hover { background: rgba(0,0,0,.04); }

.subject-icon {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.subject-label { flex: 1; }
.subject-name {
  font-size: 13px; font-weight: 600; color: var(--text);
  display: block; line-height: 1.2;
}
.subject-sub {
  font-size: 11px; color: var(--text-muted); display: block;
}
.subject-toggle {
  font-size: 10px; color: var(--text-muted);
  transition: transform .2s;
}
.sidebar-subject.open .subject-toggle { transform: rotate(90deg); }

.sidebar-notes {
  display: none; padding: 0 0 4px 0;
}
.sidebar-subject.open .sidebar-notes { display: block; }

.note-link {
  display: block; padding: 6px 20px 6px 56px;
  font-size: 13px; color: var(--text-muted);
  text-decoration: none; cursor: pointer;
  border-left: 3px solid transparent;
  line-height: 1.4;
}
.note-link:hover { background: rgba(0,0,0,.04); color: var(--text); }
.note-link.active {
  background: var(--accent-light);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 500;
}
.note-date {
  display: block; font-size: 11px; color: #999; margin-top: 1px;

  margin-bottom: 0;

.category-header:hover { background: rgba(0,0,0,.04); }
.category-toggle {

.category-notes {
  display: none; padding: 0;
}

const NOTES_CONTENT = {"2026-04-20 13-01-21-量化研究方法.md": "# 📘 研究方法｜上課整理筆記（量化研究＋描述性研究）\n\n## 一、研究方法這門課的本質\n\n### 1️⃣ 為什麼覺得難（很正常）\n\n- 範圍「包山包海」，且方法持續演進\n- 看完一輪仍「半懂不懂」是常態\n- 甚至教授也不一定敢說完全掌握\n\n> 👉 重點不是全懂，而是建立「**結構感 + 可作答能力**」\n\n### 2️⃣ 為什麼一定要學好\n\n- ✏️ 考試會出「迷你研究計畫」（很常見）\n- 📄 推甄備審／Proposal 必備\n- 🔗 能串聯四大科：\n  - 心理學\n  - 統計\n  - 測驗\n  - 研究法\n\n> 👉 核心：**量化研究法是整合樞紐**\n\n---\n\n## 二、考試重點題型（超重要）\n\n### 🧠 典型大題（30 分）\n\n> **設計一個心理諮商相關研究**\n\n你要寫出：\n\n1. 研究題目\n2. 動機\n3. 研究目的\n4. 研究問題\n5. 研究方法（最關鍵）\n\n> 👉 卡關點通常在：**研究方法怎麼寫**\n\n---\n\n## 三、關鍵觀念：研究設計 vs 資料分析（必考）\n\n### ❌ 常見錯誤\n\n把統計方法當成研究設計：\n\n- t-test\n- ANOVA\n- 回歸\n\n> 👉 這些是「**資料分析**」，不是研究設計\n\n### ✅ 正確區分\n\n| 層級 | 內容 |\n|------|------|\n| 研究設計 | 描述性 / 相關 / 實驗 |\n| 資料分析 | t-test / ANOVA / 回歸 |\n\n> 👉 一句話記：\n> **「怎麼做研究」≠「怎麼分析資料」**\n\n---\n\n## 四、量化研究三大類（核心架構）\n\n### 1️⃣ 描述性研究（Descriptive）\n\n> 👉 只描述現象，不談關係\n\n**例子：**\n\n- 滑手機比例\n- 上課專心比例\n- 詞彙使用率\n\n**特徵：**\n\n- 單一變項\n- 不探討因果或關聯\n\n**統計方法：**\n\n- 平均數\n- 比例\n- 標準差\n- 次數分配\n\n### 2️⃣ 相關研究（Correlational）\n\n> 👉 探討「**有沒有關係**」\n\n**例子：**\n\n- 睡眠時間 vs 成績\n\n**重點：**\n\n- ❗ 不談因果\n- 只看「是否一起變動」\n\n**統計方法：**\n\n- 相關係數\n- 回歸分析\n- 中介 / 調節\n\n### 3️⃣ 實驗研究（Experimental）\n\n> 👉 探討「**因果關係**」\n\n**關鍵：**\n\n- 操弄自變項\n- 控制干擾變項\n\n**例子：**\n\n- 冷氣溫度 → 專心程度\n\n**統計方法：**\n\n- t-test\n- ANOVA\n\n### 🔥 一句話統整\n\n| 類型 | 問題 |\n|------|------|\n| 描述 | 是什麼 |\n| 相關 | 有沒有關 |\n| 實驗 | 會不會影響 |\n\n---\n\n## 五、描述性研究（一）：調查法\n\n### 1️⃣ 定義\n\n蒐集：\n\n- 行為\n- 態度\n- 意見\n- 信念\n\n> 👉 重點：**仍然不探討關係**\n\n### 2️⃣ 抽樣（重要）\n\n- **隨機抽樣**（最佳）\n  - 簡單隨機\n  - 分層\n  - 叢集\n  - 系統\n\n> 👉 調查研究「**非常重視代表性**」\n\n### 3️⃣ 資料收集方式\n\n#### （1）問卷\n\n- 網路問卷（最常見）\n- 可能有「抽樣偏誤」\n\n> 👉 例：只在特定社群發 → 樣本偏差\n\n#### （2）訪談\n\n**類型：**\n\n- 面對面（有社會期許偏誤）\n- 電話（較少）\n- 焦點團體（會有團體極化）\n\n### ⚠️ 重要偏誤\n\n- **社會期許偏誤** → 回答「看起來比較好」的答案\n\n---\n\n## 六、問卷設計原則（高頻考點）\n\n### 🔥 必背重點\n\n#### 1️⃣ 避免引導性問題\n\n- ❌「血汗錢給政府？」\n- ✅「是否支持提高稅率？」\n\n#### 2️⃣ 不要雙重問題\n\n- ❌ 同時問兩件事\n\n#### 3️⃣ 不要雙重否定\n\n- ❌「是否不同意不…」\n\n#### 4️⃣ 選項要「互斥＋窮盡」\n\n- ❌ 2 萬-3 萬 / 3 萬-10 萬（重疊）\n- ✅ 明確區間\n\n#### 5️⃣ 基本資料放最後\n\n> 👉 避免防衛／偏誤\n\n#### 6️⃣ 問卷要友善\n\n- 不要太複雜\n- 減少跳題\n\n---\n\n## 七、描述性研究（二）：觀察法\n\n### 1️⃣ 定義\n\n> 👉 **不問人，直接觀察行為**\n\n### 2️⃣ 優點\n\n- 減少社會期許偏誤\n- 更接近真實行為\n\n### 3️⃣ 分類\n\n#### （1）結構式 vs 非結構式\n\n| 類型 | 特徵 |\n|------|------|\n| 結構式 | 有明確觀察指標（可量化） |\n| 非結構式 | 開放觀察（偏質性） |\n\n#### （2）介入 vs 非介入\n\n| 類型 | 說明 |\n|------|------|\n| 有介入 | 研究者進入情境 |\n| 無介入 | 完全旁觀 |\n\n#### （3）情境\n\n| 類型 | 說明 |\n|------|------|\n| 自然情境 | 真實環境 |\n| 人為情境 | 實驗室 |\n\n---\n\n## 八、觀察研究關鍵技術\n\n### 1️⃣ 抽樣方式\n\n- **時間抽樣**（抽時間段）\n- **事件抽樣**（特定事件）\n\n### 2️⃣ 資料紀錄（量化關鍵）\n\n- 次數\n- 時間\n- 有 / 無\n\n> 👉 一定要能轉成數字\n\n---\n\n## 九、觀察研究的誤差（超重要）\n\n### 1️⃣ 被觀察者效應\n\n> 👉 被觀察 → 行為改變\n\n### 2️⃣ 觀察者偏誤\n\n- 預設立場（偏見）\n- 光環效應\n- 寬大 / 嚴格誤差\n- 中央趨勢\n\n### 3️⃣ 信度問題（考試會考）\n\n> 👉 多觀察者需一致\n\n**方法：**\n\n- 相關係數（連續資料）\n- 一致比例（簡單）\n- Kappa（進階）\n\n---\n\n## 十、考試策略（很關鍵）\n\n### 🧠 心態技巧（老師強調）\n\n**❌ 扣分思維：**\n\n- 我這題錯了\n- 我又少 5 分\n\n**✅ 加分思維：**\n\n- 這題我拿 2 分\n- 這題我至少 25 分\n\n> 👉 影響表現很大（**自我應驗預言**）\n\n---\n\n## 🎯 最後幫你收斂一個核心框架\n\n### ✨ 研究法作答模板（超重要）\n\n當你遇到研究題：\n\n1. 題目\n2. 動機\n3. 目的\n4. 研究問題\n5. 研究設計（描述 / 相關 / 實驗）\n6. 抽樣\n7. 工具（問卷 / 觀察）\n8. 資料分析\n\n\n## 主要章節\n\n### 一、量化研究概述\n- **定義**：量化研究以數據為基礎進行，透過統計方法分析結果。\n- **預測題型**：選擇題/解釋名詞 5-10分 / 申論題 25分  \n- **學校考試偏好**：北師、實踐、師大\n\n### 二、研究設計類型\n| 類型         | 定義                                   | 特徵                                    | 常用統計方法                  |\n|--------------|----------------------------------------|-----------------------------------------|-------------------------------|\n| 描述性研究   | 觀察特定現象，無變數間關聯性        | 只描述數據，不探究關聯                 | 敘述統計、單變數假設檢定    |\n| 相關研究     | 探討變數間的關係                     | 不操控變數，僅觀察變數之間的相關性    | 相關計算、回歸分析          |\n| 實驗研究     | 操控自變數以觀察其對依變數的影響    | 控制環境，隨機分配                      | ANOVA、T檢定等              |\n\n🧠 記憶法：**描述的事，相關的兩，實驗操控依變！**\n\n### 三、描述性研究\n- **定義**：描述某一特定群體之行為、知識、信念等，無需探討其間關聯性。\n- **方法**：調查法（問卷、訪談）與觀察法。\n- **預測題型**：選擇題。\n\n### 四、相關研究\n- **定義**：探討兩個變數間的關聯性，但不操控變數。\n- **預測題型**：選擇題/申論題 25分。\n\n### 五、實驗研究\n- **定義**：研究者操控自變數以觀察其對依變數的影響。\n- **程序**：\n  1. 隨機分配參與者。\n  2. 控制混淆變數。\n  3. 收集數據。\n- **預測題型**：選擇題/申論題 25分。\n\n### 六、調查研究方法\n- **調查方法**：\n  - **問卷調查**：使用量化問題，需確保問題不具引導性。\n  - **訪談法**：用口頭詢問，得知參與者的意見。\n\n💡 **申論用**：調查研究需服務於研究問題，設計問卷時需注意中立性及有效性。避免情緒性字詞及引導性問題。  \n📌 **考點提醒**：社會期望偏誤（Social Desirability Bias）及其影響。\n\n### 七、觀察法\n- **定義**：在自然情境或控制情境中系統而有計畫地觀察個體行為。\n- **類型**：\n  - 結構式觀察：觀察特定行為及其出現次數。\n  - 非結構化觀察：開放性觀察，記錄多種行為。\n- **預測題型**：解釋名詞 5-10分 / 申論題 25分。\n\n## 重要考點\n1. **研究設計與資料分析的區別**：設計決定使用的研究方法，分析則決定使用的統計方法。\n2. **調查與觀察的不同**：調查是主觀表達，觀察是客觀記錄。\n\n## 一句話總結\n“量化研究方法透過系統的設計與精確的數據分析，揭示心理學現象的深層次關聯性。”\n\n### 實用記憶口訣\n- **調查**：我問你，結果一起來。\n- **觀察**：靜靜看，結果記下。\n\n這些結構化的筆記將有助於你在複習量化研究方法的時候，更有效地針對考試準備。", "2026-04-18 18-27-29.md": "# 諮商所入學考試備考筆記\n## 科目：輔導原理\n## 1. 考試題型概述\n- **選擇題**\n- **解釋名詞 (5-10分)**\n- **申論題 (25分)**\n\n### 🔥 考試重點分析\n在諮商所的考試中，通常會涉及到應用情境，學生需要能夠將心理學知識與理論應用於具體的個案中。\n\n### ⭐ 特別考頻學校\n- 國立北部大學 \n- 屏東教育大學\n- 台中教育大學\n\n## 2. 重要概念應用\n以下是一些可能的應用個案以及相關的心理學技術和方法：\n\n| 個案情境   | 應用理論/技術           | 注意事項                          |\n| ---------- | ------------------------ | --------------------------------- |\n| 學習障礙   | 行為療法、認知療法      | 針對學習策略的調整                |\n| 憂鬱症     | 認知行為療法、情感支持  | 開展個案管理和系統性輔導          |\n| 情緒問題   | 精神分析理論、遊戲治療  | 認識情緒背後的衝突和表現          |\n\n### 🔍 考點提醒\n- 在考試中，經常出現的會是針對個案的具體應用題，因此對於前述的每一種應用情境需熟悉理論和治療方法。\n\n## 3. 記憶法與口訣\n- **個案情境法**：將個案情境撰寫於卡片上，利用隨身攜帶的方式隨時複習。\n- **簡單口訣**：SORE (S: 情境, O: 目標, R: 方法, E: 須注意)\n\n## 4. 申論題預測與整合\n考生需準備好針對特定個案的輔導方案或治療計畫撰寫，其中可融合不同心理學流派的理念。例題：  \n「請解釋對於一名有學習困難且伴隨憂鬱症狀的學生，你將如何設計輔導方案？」\n\n## 5. 總結重點\n> \"心理學的應用在於幫助人們從多元的視角去理解與改善他們的心理狀態。\"\n\n本筆記旨在協助考生理解應用心理學的重要性，以及範圍和情境中的具體應用，讓學生準備好面對研究所入學考試的挑戰。", "2026-04-18 18-35-49.md": "# 敘事治療備考筆記\n## 科目：輔導原理\n## 1. 敘事治療概述\n敘事治療（Narrative Therapy）是一種後現代取向的心理治療方法，強調透過故事來解構與重構人們的經歷與自我認知。主要觀點有以下幾點：\n\n- 🔥 **人與問題是分開的**：人不是壞人，做錯事不等於個人的價值。\n- 🔥 **解構與重構**：透過分析與重組故事來促進自我理解。\n  \n| 理論要素          | 敘事治療特點                  | 傳統理論                      |\n|-------------------|-------------------------------|-------------------------------|\n| 人與問題的關係  | 分開對立，重視過程            | 相互依賴，常將個人價值與行為聯繫 |\n| 治療師角色        | 探索者，共同發現者            | 權威者，指導者                |\n| 問題處理方式      | 外化問題                      | 直接解決                      |\n\n## 2. 解構的意義\n解構是一個關鍵程序，透過將問題外化來幫助個案更清楚地認識自身的挑戰。\n\n- 📌 **解構步驟**：\n  1. **識別問題**：識別並確認問題的存在。\n  2. **將問題外化**：例如，對話中將「懶惰」具象化，將其放在空椅子上對話。\n  3. **重建自我價值**：讓個案認識到他們的人格與行為是分開的。\n\n## 3. 外化技術\n外化技術幫助個案不再將負面特質內化，常用的方式包括：\n\n- 🎯 **外化問句**：例如，將懶惰具象化並與之對話。\n- 💡 **以比喻引導**：透過比喻（如「人都會死」）讓個案超越限制，重新看待問題。\n\n## 4. 影域的應用\n影域（Affect）是透過具象化的方式，讓個案重新評估自己的情緒反應和內在對話。\n\n- ⭐ **影域的特點**：\n  - 用比喻型式思考問題，幫助個案看見其他視角。\n  - 常用於學術壓力輔導，如學術論文寫作問題。\n\n## 5. 常考學校與題型\n- 常考學校：教育大學系列、北師、師大、實踐、輔仁等。\n- 預測題型：\n  - 📌 選擇題：敘事治療的基本概念。\n  - 📌 解釋名詞（5-10分）：解釋解構與重構的意義。\n  - 🎯 申論題（25分）：針對外化技術的實際應用。\n\n## 記憶口訣\n- **用故事解構，是非非我分開**（解構: 問題與人分開，重建自我）。\n\n## 一句話總結\n「敘事治療的核心在於透過故事的力量，重新釐清個人的價值與行為之間的關係。」", "2026-04-18 18-54-25.md": "# 合作語言取向 (Linguistic Approach) 備考筆記\n## 科目：輔導原理\n## 一、概述\n🔥 **定義**：合作語言取向 (Linguistic Approach) 是一種後現代心理治療取向，強調社會建構和多元現實，這一理論的發展反映了人們對現實的多樣理解。\n\n📌 **重要性**：此取向特別關注於語言與對話如何在治療和理解中扮演關鍵角色。\n\n### 主要概念\n| 概念           | 說明                                                         |\n|----------------|--------------------------------------------------------------|\n| 多元現實        | 每個人對同一事物有不同的解釋，現實是社會共同建構的結果。                    |\n| Tocque椅子      | 在對話中，每位參與者都平等地表達自己的觀點，共同建構理解，非單方面的溝通。      |\n| 公開話         | 治療師與個案之間開放內心思考的過程，促進有效的對話與理解。                      |\n| 相互轉化       | 在治療過程中，治療師和個案互相影響與成長，個案的成就也促進治療師的成長。        |\n| 不確定性       | 治療過程中不會預設明確的結果，著重於個案在過程中的探索與建構自我世界。          |\n\n## 二、理論背景\n⭐ **歷史背景**：合作語言取向起源於後現代主義心理學，注重語言的功能以及如何透過對話而達成理解。\n\n🎯 **題型預測**：\n- 選擇題（例如，多元現實的定義是什麼？）\n- 解釋名詞 (5-10分，解釋Tocque椅子的概念)\n- 申論題 (25分，討論合作語言取向在心理治療中的應用和意義)\n\n### 特別考試偏好學校\n- 北師大學\n- 師範大學\n- 實踐大學\n- 輔仁大學\n\n## 三、重要議題與關鍵點\n### 1. 多元現實\n🧠 **記憶法**：想像色彩的多樣性，發現每個人對於同一顏色的不同看法。\n\n### 2. 對話與共創\n💡 **申論用**：對話不是單向的交流，而是彼此的了解與共同探索。在治療中，這種多元性的對話可以促進深入的理解。\n\n### 3. 不確定性\n🧠 **記憶法**：心理治療的路徑不是固定的，讓個案自由探索是治療的核心。\n\n## 四、結論\n🎯 **一句話總結**：合作語言取向強調透過對話和共同建構，讓心理治療成為一場雙向的探索之旅。\n\n## 五、個人發展與反思\n💡 **未來職涯**：期望學生們能夠不僅學習理論，更能在實踐中發展出屬於自己的治療風格，成為獨一無二的心理諮商師。\n\n## 六、結尾\n珍惜心理治療的每一次交流與探索，因為每一位個案都是獨特的，而你的成長和理解，正是在這樣的互動中得以實現。", "2026-04-18 19-15-07.md": "# 自我探索與導師的影響\n## 科目：輔導原理\n## 課程概述\n在此段錄音中，學生回憶起小學時期遇到的導師對自己成長過程的影響。這位導師不僅提供學術支持，更對學生的心理成長產生深遠的影響，引發對自我探索及心理學的興趣。\n\n---\n\n## 重要概念\n\n| 概念               | 解釋                                                      |\n|-------------------|---------------------------------------------------------|\n| 導師的影響       | 導師能夠發現學生的情感狀況，並提供必要的支持和引導。  |\n| 自我探索         | 透過回顧過去，了解自己的情感與需求，以促進心理成長。  |\n| 心理學派         | 諮商學生需了解不同的心理學派，如精神分析、薩提兒治療等。|\n\n---\n\n## 學習重點 🔥\n\n- 導師的角色對於學生的心靈成長極為重要，尤其在面對家庭壓力時。\n- 自我探索需建立在回顧與反思的基礎上，以了解自身的情感需求。\n- 理解不同心理學派的觀點，能有助於未來的職業發展。\n\n## 預測題型\n- **選擇題**：導師對學生成長的影響。\n- **解釋名詞 5-10分**：自我探索、心理學派。\n- **申論題 25分**：討論導師如何影響學生的心理成長與發展。\n\n---\n\n## 學校考試偏好\n- **特別關注學校**：教育大學系列、北師、師大、實踐、輔仁\n\n---\n\n## 記憶法 🧠\n- **「導師的陽光」**：想像導師像陽光，照耀在學生身上，幫助他們走出黑暗。\n\n---\n\n## 一句話總結 💡\n「每一位導師都是影響學生成長旅程中的光源，照亮他們探索自我的道路。」", "2026-04-18 20-58-14.md": "# 精神分析理論備考筆記\n## 科目：輔導原理\n## 📘 重要理論概述\n\n本章節將從精神分析的重要理論及其主要人物出發，包括佛洛伊德的精神分析、阿德勒的個體心理學、榮格的分析心理學與客體關係理論等。\n\n### 🔥 佛洛伊德的精神分析\n\n- **主要組成**  \n  | 組成部份 | 定義 | 原則 | 位置 |\n  |----------|------|------|------|\n  | 本我 (Id) | 利用慾望、需求 | 快樂原則 | 潛意識 |\n  | 自我 (Ego) | 現實的考量，調和本我需求 | 現實原則 | 意識與潛意識之間 |\n  | 超我 (Superego) | 道德規範，社會期望 | 道德原則 | 潛意識 |\n\n- **發展階段**  \n  | 階段名稱 | 年齡範圍 | 特徵 | 主要心理任務 |\n  |----------|----------|------|----------------|\n  | 口腔期 | 0-1歲 | 吸吮滿足 | 信任與不信任 |\n  | 肛門期 | 1-3歲 | 控制能力 | 自控與邊界設定 |\n  | 性類期 | 3-6歲 | 恋父戀母情結 | 性別認同 |\n  | 潛伏期 | 6-12歲 | 友誼與社交 | 同性友誼發展 |\n  | 生殖期 | 12-18歲 | 異性戀愛情 | 人際關係建立 |\n\n### ⭐ 阿德勒的個體心理學\n\n- **社會性原則**  \n  社會性心理學的重點在於人際關係對個體的影響，認為社會互動是苦樂的關鍵。\n\n- **自卑與超越**  \n  阿德勒強調每個人都有自卑感，而這種自卑感推動我們去超越。\n\n- **家庭星座**  \n  在輔導中分析個體在家庭中的出生順序如何影響其心理狀態。\n\n### 📌 榮格的分析心理學\n\n- **集體潛意識**  \n  每個人都擁有與生俱來的意識，產生共通的心理特徵。\n\n- **圓形 (Archetypes)**  \n  榮格提出的圓形包括：  \n  - **Persona**：社交面具  \n  - **Ani Ma**（男人中的陽剛）  \n  - **Ani Ma**（女人中的陰柔）\n\n### 💡 客體關係理論\n\n- **定義**  \n  客體關係理論聚焦於人際關係，及早期經驗如何影響成年後的關係建立。\n\n## 🎯 題型預測\n- **選擇題**：本我、自我與超我的定義及位置。\n- **解釋名詞**：戀父戀母情結、集體潛意識。\n- **申論題**：比較佛洛伊德與阿德勒的理論異同。\n\n## ⭐ 考試資訊\n- **特別愛考學校**：\n  - 教育大學系列與阿德勒相關的問題。\n  - 實踐大學對榮格心理學的考查。\n  - 師大與輔仁則涵蓋廣泛的精神分析理論。\n\n## 🧠 記憶方法\n- **口訣**：**佛羅的三個，我的主**：本我、超我、自我 = 幸福、道德現實。\n- **聯想記憶**：將每個發展階段與對應年齡作關聯，例如：口腔期（0-1歲）：嬰兒期的吸吮行為。\n\n## 🔑 一句話總結\n「精神分析理論提供了一種深入理解人類心理的視角，揭示了潛意識動力及早期經驗對個體發展的重要性。」", "2026-04-18 21-40-31-樊老師11mins.md": "# 課題關係理論與心理分析\n## 科目：輔導原理\n## 📝 主要概念\n\n### 課題關係理論\n- **定義**：研究人類與人或物之間的情感關係，特別是母嬰關係。\n- **重要學者**：Marlow與Klein。\n\n### Marlow的四個時期\n| 階段     | 說明                                        |\n|----------|---------------------------------------------|\n| 共生期   | 嬰兒與母親密切聯繫，(6-8個月)嬰兒依賴母親。|\n| 分離期   | 嬰兒開始探索世界，母親需適度放手，避免過分保護。|\n| 依附關係 | 嬰兒認識到母親的存在感，能夠自信探索外界。 |\n| 自我實現 | 嬰兒能夠獨立，接受母親的存在，開始上學。   |\n\n### Klein的理論\n- **好課題 vs 壞課題**：當母親滿足嬰兒需求，成為「好課題」；否則為「壞課題」。\n- **心理發展重視**：特別強調兩歲以前的學生與母親的互動。\n\n## 🔍 比較心理學理論\n\n### 精神分析 vs 個體心理學\n\n| 理論          | 精神分析                           | 個體心理學                         |\n|---------------|----------------------------------|----------------------------------|\n| 代表學者      | 佛洛伊德（Freud）                 | 阿德勒（Adler）                  |\n| 理論基礎      | 潛意識驅動，動機受本能影響        | 社會互動及個人生活經歷影響內在動力 |\n| 側重觀點      | 以為潛意識深層為焦點              | 著重社會環境與自我感知          |\n\n⭐ **常考**：北師、師大、教育大學系列對於Klein理論的考題特別喜愛。\n\n## 📚 申論題型預測\n- **解釋名詞（5-10分）**：課題關係理論的核心概念。\n- **申論題（25分）**：深入探討Klein的理論及其在心理治療中的應用。\n- **比較題（解釋兩者的不同，10-15分）**：精神分析與個體心理學的不同點。\n\n## 🧠 記憶法\n- 使用「共分依自」來記憶Marlow的四個時期：共生、分離、依附、自我實現。\n- Klein的好壞課題可以用「好壞」對應「滿足需求的母親」來連結。\n\n## 💡 申論開頭引用\n“心理學的理論不僅是知識，更是我們未來職涯的重要指導。”\n\n## 🎯 整體學習目標\n在學習心理學的過程中，要明白不同理論的內涵與應用，形成自己的理解及應用方式，以便在實務中發揮最大效用。同時，這將有助於提升從業者幫助他人的能力。\n\n## 最後總結\n學習心理學不僅是為了考試，更是為了在未來的輔導工作中能夠運用自己所學的理論，達到真正的幫助他人的目的。", "2026-04-20 14-46-23-普心-動機.md": "# 📘 普通心理學｜02-動機（Motivation）上課整理筆記\n## 科目：普通心理學\n---\n\n## 一、什麼是動機\n\n> **動機**：推動行為並給予方向的條件；啟動、引導、維持**生理活動**與**心理活動**的所有力程。\n\n---\n\n## 二、動機章節整體架構\n\n### 1️⃣ 動機的來源（今天重點）\n\n- 本能論\n- 學習論\n- **驅力（Drive）** ⭐\n- **誘因（Incentive）** ⭐\n- 預期與歸因\n- **需求的階層** ⭐\n- **主動尋求刺激 / 心理需求** ⭐\n\n### 2️⃣ 各種動機行為\n\n- **生理**：進食行為、喝水行為、性行為\n- **心理**：成就動機等\n\n---\n\n## 三、考古題比重分佈\n\n| 主題 | 大約比重 |\n|------|----------|\n| 需求的階層 | 約 50% |\n| 驅力 + 誘因 | 30 ～ 35% |\n| 主動尋求 / Yerkes-Dodson | 其餘部分 |\n\n> 進食行為、性行為、成就動機留待日後詳談。\n\n---\n\n## 四、四大動機來源總覽\n\n| # | 來源 | 關鍵字 | 例子 |\n|---|------|-------|------|\n| 1 | 驅力 | 內在推力（生理） | 肚子好餓想吃東西 |\n| 2 | 誘因 | 外在拉力 | 明明想睡覺還是熬夜打電動 |\n| 3 | 主動尋求刺激 | 尋求適度喚起 | 自己想要去冒險 |\n| 4 | 心理需求 | 高階需求 | 想考上研究所 |\n\n> 🎯 今天除了講這四個以外，最重要的是**利用這四個動機來源，建構自己面對考試不同階段的動機運用**（見第八段表格）。\n\n---\n\n## 五、驅力理論（Drive Theory）\n\n### 1️⃣ 定義\n\n- **Drive = 驅力 / 動力**\n- 驅力主導行為，**起於內在的生物性驅力**\n- 兩個關鍵字：**內在 + 生物**\n\n> 👉 選擇題看到「口渴、飢餓」→ 馬上想到是**驅力**\n> 描述一大堆跟生理無關的 → 其實是**誘因**\n\n### 2️⃣ 赫爾（Hull）驅力減降理論（Drive Reduction Theory）\n\n#### 前提：恆定作用（Homeostasis）\n\n有機體會尋求**生理狀態的均衡**，例如：\n\n- 體溫維持在 36 度左右\n  - 太熱 → 流汗\n  - 太冷 → 發抖（肌肉顫抖產生熱能）\n- 血糖：太低產生飢餓感；太高停止進食\n- 體液：水分太少會產生口渴\n\n#### 流程圖（循環）\n\n```\n恆定 → 恆定被破壞（不均衡）→ 驅力產生 → 行動 → 驅力減低 → 回到恆定\n```\n\n> 👉 **目的**：行動是為了「驅力下降」；下降就沒事了，就滿足了。\n\n#### 老鼠實驗舉例\n\n- 做實驗前先讓老鼠餓 / 不讓牠喝水\n- 血糖降低 → 覓食驅力被喚起 → 行動（覓食）→ 不餓了 → 驅力降低\n\n### 3️⃣ 驅力理論的限制\n\n✅ **有效解釋**：基本的生理驅力\n\n❌ **無法解釋**：\n\n- 心理需求\n- 外部刺激\n- 尋求刺激（非減少驅力）\n- 社會動機（如成就動機）\n\n#### 關鍵反例\n\n- 老鼠被剝奪食物和水很久，放入**含有食物和水的新奇環境**中 → 反而展現**探索行為**，而非立刻進食\n- 老鼠會花大量時間精力探索**複雜環境中的各種裝置和新事物**\n- 👉 好奇心、探索並不是純粹的生理需求，而是心理的滿足\n\n---\n\n## 六、誘因理論（Incentive Theory）\n\n### 1️⃣ 定義\n\n- 外部因素 → 外在的拉力\n- 跟**生物性需求沒有直接關係**的外在刺激\n- 例：明明好想睡覺，還是熬夜打電動；明明已經喝過咖啡，下午經過茶水間又不自覺泡一杯\n\n### 2️⃣ 必記英文\n\n| 英文 | 中文 |\n|------|------|\n| Drive | 驅力 |\n| Incentive | 誘因 |\n\n> 👉 考題常出現全英文選項，英文一定要認得。\n\n### 3️⃣ 行為的複雜性：多癮（成癮）案例\n\n同時存在**內在驅力**與**外在誘因**。\n\n#### 階段一：驅力（消除戒斷不適）\n\n- 長期使用者一旦停止 → 出現戒斷症狀（不舒服）\n- 為了消除不舒服 → 再次使用\n- 完全符合赫爾的驅力減降理論\n\n#### 階段二：想要敏感化（Berridge 實驗）\n\n**實驗設計：**\n\n- 早期在老鼠大腦植入電極，刺激多巴胺分泌\n- 老鼠不吃不喝不睡，瘋狂按壓自我刺激開關\n- 後在人身上做類似實驗（今天不再允許）\n- 行為與老鼠一致\n\n**驚人發現：**\n\n- 當事者自述：**我不快樂、我很痛苦，但是我「想要」**\n\n#### 重要概念區分\n\n| 感受 | 意義 | 大腦機制 |\n|------|------|----------|\n| 喜歡（Liking） | 主觀愉悅 | ≠ 多巴胺 |\n| 想要（Wanting） | 被驅動去做 | = 多巴胺 |\n| 快樂 | 不等於想要 | 不同系統 |\n\n> 👉 多巴胺只讓你「想要」，不一定讓你「喜歡」或「快樂」。\n\n**日常例子：**\n\n- 吃得很飽，看到同事吃雞排還是好想再吃一口 → **「想要」**\n- 真的吃下去：其實不一定喜歡、不一定快樂\n\n**對成癮的啟示：**\n\n- 戒斷後誘因線索（注射器、毒品、舊環境、舊朋友）仍會勾起「想要」\n- 這就是為什麼戒了又回去，回去又戒了\n- 法律和治療師管不到的是**環境線索與交友狀況**\n\n### 4️⃣ 動機的總結\n\n- 一開始：為了誘因的喜悅（追求快樂）\n- 後來：為了降低痛苦（減少驅力）\n- 戒除後：仍會被誘因線索重新勾起\n- 👉 **動機不能只看生理需求，還要看外部誘因同時發揮作用**\n\n---\n\n## 七、主動尋求刺激（Arousal Theory）\n\n### 1️⃣ 核心概念\n\n- **Arousal Theory（喚起理論）**\n- 並非追求**零喚起**，而是追求一種**適度的、理想的喚起水準（Optimal Arousal Level）**\n- 從平靜狀態 → 追求激發、活化\n\n### 2️⃣ 感覺剝奪實驗（Sensory Deprivation）\n\n- 把人放在完全沒有聲音、沒有光線、沒有刺激的環境 → 人會崩潰\n- 二戰時曾用於戰俘 → 戰俘「瘋掉」\n- 👉 證明：**人類需要一定程度的刺激**\n\n### 3️⃣ Yerkes-Dodson Law（耶杜二氏法則 / 倒 U 型假說）\n\n> 動機 / 壓力水平與工作表現的關係。\n\n#### 曲線（倒 U 型）\n\n```\n表現(Performance)\n   高 |        ___\n      |      /     \\\n      |    /         \\\n      |  /             \\\n   低 |_/________________\\___\n        低    最適    高     喚起/壓力/焦慮\n```\n\n#### 結論\n\n- **壓力太低** → 太無聊，表現差\n- **壓力太高** → 太焦慮，表現差\n- **中等壓力** → 表現最佳 ⭐\n\n### 4️⃣ 考試焦慮應用\n\n- 面臨高難度考試，若焦慮極高 → 會被壓住、完全無法應對\n- **解法：減敏感練習**\n  - 拿考古題，**自己設定時間**\n  - 不能考古題一份寫兩天（太鬆、沒壓力）\n  - 在時間壓力下練習 → 系統減敏感 → 慢慢不那麼緊張\n\n### 5️⃣ 感覺尋求（Sensation Seeking）是一種特質\n\n- 每個人的「最適喚起水準」都不同\n- 有人 optimal 較高（喜歡刺激），有人較低（喜歡平靜）\n- 👉 跟個人特質有關\n\n### 6️⃣ 延伸啟示\n\n- 動機若只是消除痛苦 → 喚起太低 → 天天躺平\n- 大腦有最適喚起 → 所以我們仍會挑戰難題\n- 👉 所以考試計畫**一定要排入運動、聽音樂**\n  - 要能**提高喚起**，也要能**降低喚起**\n  - 瞭解自己最適中間點很重要\n\n---\n\n## 八、心理需求（Psychological Needs）\n\n### 1️⃣ 定義\n\n- 行為**不是**由身體匱乏所驅動\n- 而是源自個體對**自我成長、社會認同、成敗解釋**的心理需求\n- 👉 **是一種心理需求，不是身體匱乏**\n\n### 2️⃣ Maslow 需求階層理論\n\n> 馬斯洛提出的階層需求理論：人類的需求由高低階層之分，**先滿足低階，再滿足高階**。\n\n#### 階層結構（由下而上）\n\n| 層級 | 需求 | 類型 |\n|------|------|------|\n| 5 | 自我實現（Self-actualization） | **成長需求** |\n| 4 | 自尊 | 匱乏需求 |\n| 3 | 愛與隸屬 | 匱乏需求 |\n| 2 | 安全 | 匱乏需求 |\n| 1 | 生理 | 匱乏需求 |\n\n#### 匱乏需求 vs 成長需求\n\n| 類型 | 涵蓋 | 方向 |\n|------|------|------|\n| 匱乏需求 | 生理、安全、愛與隸屬、自尊 | 從**負 → 零**（不夠會不舒服） |\n| 成長需求 | 自我實現 | 從**零 → 正**（我現在 OK，但要更好） |\n\n#### 考古題陷阱\n\n> 某題：「一個媽媽為了保護小孩，寧願犧牲自己的生命」── 符合需求階層嗎？\n>\n> ❌ **不符合**：生命 = 生理（最底層）；愛 = 第三層。高層需求不應凌駕低層需求。\n\n### 3️⃣ Maslow 的更新：自我超越（Self-transcendence）\n\n- 馬斯洛過世前反省其理論\n- 原本最頂層是「自我實現」→ 但可能讓人變得自私\n- 新增第六層：**自我超越**（大我）\n- 過世兩年後，徒弟將此理論發展為**超個人心理學（Transpersonal Psychology）**\n- 👉 現在會把自我超越放在「靈性」的面向\n\n### 4️⃣ 心流（Flow / 福樂）\n\n> 別名：高峰經驗（Peak Experience）、忘我狀態\n\n#### 定義\n\n- 全心全力投入、忘我、忘記時間、忘記吃飯的狀態\n\n#### 心流出現的條件\n\n**難度 × 能力 的匹配：**\n\n| 情境 | 結果 |\n|------|------|\n| 能力低 × 任務難度高 | 挫折 |\n| 能力高 × 任務難度低 | 無聊 |\n| **能力 ≈ 難度（中間）** | **心流** ⭐ |\n\n#### 電動遊戲的成癮機制\n\n- 第一關：能力低，敵人也弱\n- 進到下一關：能力進步 → 敵人也變強\n- **難度跟著能力一起成長** → 持續觸發心流\n\n#### 備考啟示\n\n- 不要太急，要跟隨自己的腳步\n- 難度要比能力**再多一點點** → 才能進入心流\n\n### 5️⃣ 匱乏需求 vs 成長需求的圖示\n\n| 區段 | 方向 | 性質 |\n|------|------|------|\n| 匱乏需求 | 不滿足（負）→ 沒有不滿足（零） | 驅力減降 |\n| 成長需求 | 沒有滿足（零）→ 滿足（正） | 創造滿足 |\n\n---\n\n## 九、成就動機（Achievement Motivation）\n\n### 1️⃣ McClelland 麥克里蘭\n\n- 成就動機 = **一種穩定的特質**\n- **高成就動機者**：選擇**中等難度**的任務（帶來最大滿足感）\n\n### 2️⃣ Atkinson 阿特金森 期望價值理論\n\n#### 公式\n\n```\n成就動機 = 成就需求 × 預期 × 價值\n```\n\n| 要素 | 意義 |\n|------|------|\n| 成就需求 | 我有沒有強烈要做這件事的需求？ |\n| 預期 | 我預期自己能不能成功？ |\n| 價值 | 做了這件事會帶來什麼好處？ |\n\n#### 日常例子\n\n- 小孩參加全聯畫畫比賽：\n  - 需求很低 → 不想做\n  - 預期低（我畫不好）→ 不想做\n  - 價值高（獎品豐厚）→ 願意做\n\n### 3️⃣ 歸因理論（Attribution Theory）\n\n> 我們如何解釋成功與失敗，會影響下次的動機。\n\n#### 三個向度\n\n| 向度 | 內涵 | 例子 |\n|------|------|------|\n| **穩定性** | 原因會不會隨時間改變 | 能力（穩定）vs 運氣（不穩定） |\n| **內/外在性** | 自己還是環境 | 努力（內在）vs 考題太難（外在） |\n| **可控性** | 個人能否控制 | 學習策略（可控）vs 生病（不可控） |\n\n#### 健康的歸因方式\n\n| 結果 | 建議歸因 | 原因 |\n|------|---------|------|\n| 成功 | 內在：「我好努力」 | 維持動機 |\n| 失敗 | 努力不足 / 策略問題 | 未來動機不會下降；可改變 |\n\n#### 對孩子的鼓勵\n\n- ❌ 「你好聰明」（聰明是先天、不可控）\n- ✅ 「你好努力」（努力是可控、可改變）\n\n> 👉 失敗歸因為「我就是笨、讀不來」→ 不會再次努力\n> 失敗歸因為「策略有問題，我來換方法」→ 願意再試\n\n---\n\n## 十、考試準備三階段動機策略 ⭐\n\n### 第一階段（約 4–6 月）：建立心態\n\n| # | 策略 | 重點 |\n|---|------|------|\n| 1 | **成長心態** | 相信努力就會進步 |\n| 2 | **精熟目標** | 理解概念本身，不是擊敗對手 |\n| 3 | **累積自我效能**（Bandura） | 相信「我做得到」 |\n\n> 👉 **自我效能**：大量研究指出，**學業成績與自我效能的相關性 > 與 IQ 的相關性**。相信自己可以的人，才會持續嘗試。\n\n### 第二階段：做穩定（建立自動化）\n\n| # | 策略 | 重點 |\n|---|------|------|\n| 1 | **執行意圖（Implementation Intention）** | 設定明確計畫（巨細靡遺） |\n| 2 | **管理最佳喚起水平**（Yerkes-Dodson） | 找到自己的最適 |\n| 3 | **維持生理 set point** | 穩定睡眠、飲食、運動 |\n\n#### 執行意圖的正確寫法\n\n- ❌ 「我禮拜天要讀書」（太空泛）\n- ✅ 「下午兩點鐘聲響起，我就坐在書桌前讀設實動機，讀到某頁某章」\n\n#### 最佳喚起管理\n\n- 容易緊張者 → 做一些放鬆調節（例：唸簡單單字時聽音樂）\n- 容易鬆散者 → 讓自己稍微緊張（例：複雜統計需安靜專注）\n\n### 第三階段（約 10–12 月）：衝刺期\n\n| # | 策略 | 重點 |\n|---|------|------|\n| 1 | **善用誘因理論** | 完成一項任務 → 給自己小獎勵 |\n| 2 | **尋找戰友**（親和動機） | 一起奮鬥，減緩焦慮 |\n| 3 | **成敗歸因** | 失敗歸因為努力 / 策略；成功歸因為「我好棒」 |\n\n#### 關於過度辯證效應（Overjustification Effect）\n\n- 外在獎賞可能讓內在動機被外在動機化\n- 一般情境下**不推薦**（例：小孩原本自動寫作業，給糖果後變成「為糖果寫作業」）\n- **但衝刺期 OK**：此時要動用一切可能的拉力，暫時用外在獎勵維持動機\n\n#### 親和動機的價值\n\n- 考試是孤獨的旅程，人在高壓下會尋求連結\n- 戰友可以減緩焦慮\n- 原來別人也會有一樣的狀況 → 感覺好很多\n\n---\n\n## 🎯 本堂核心總結\n\n### 動機的四大來源\n\n1. **內在推力**：驅力（驅力減降理論）\n2. **外在拉力**：誘因（獎賞敏感化）\n3. **主動尋求**：最適喚起水準（倒 U 型）\n4. **心理因素**：Maslow 需求階層、成就動機、歸因\n\n### 備考運用\n\n把這四個動機來源，對應到**備考三階段**（建立心態 → 做穩定 → 衝刺期），就能讓動機在整個備考過程中持續運作。\n\n> ✨ 好好地利用動機原理，準備這一次的考試！", "2026-04-20 15-54-12-普心-緒論.md": "# 📘 普通心理學｜緒論 上課整理筆記\n\n---\n\n## 一、本次課程大綱\n\n1. 心理學這個學科包含的內容\n2. 普通心理學教科書中沒有的**新興主題**\n3. 心理學與其他學科有何不同\n4. 心理學思潮的改變（1879 → 現今約 150 年）\n5. 心理學研究方法介紹\n6. 心理學研究的**六個分析層次**\n\n---\n\n## 二、心理學包含的內容\n\n### 1️⃣ 從心理系課程安排看\n\n| 年級 | 主要科目 |\n|------|----------|\n| 大一 | 普通心理學、**統計** |\n| 大二 | 統計、**實驗法**、**測驗**（三大方法）、發展、生理心理學（生物心理學） |\n| 大三 | **四大金剛**：知覺、認知、社心、人格 |\n| 進階選修 | **諮商**、**變態心理學**（異常心理學） |\n\n> 💡 大一統計幾乎讓 80–90% 心理系新生大失所望——「心理系不是佛洛伊德、躺沙發嗎？怎麼要學統計？」\n> 但統計是方法學的基礎，沒有它就無法研究看不見的心智歷程。\n\n#### 變態心理學的爭議名稱\n\n- 英文 abnormal = **非正常**\n- 中文「變態」帶有負面意味\n- 張老師翻譯為「**異常心理學**」更貼切\n\n### 2️⃣ 心理系出路（三大方向）\n\n| 出路 | 對應科目 | 研究/服務對象 |\n|------|---------|---------------|\n| **基礎研究** | 統計、方法、發展、生理、知覺、認知、社心、人格 | 一般正常人（如大學生） |\n| **諮商輔導** | 諮商相關 | 正常人但有困擾（感情、學業、交友） |\n| **臨床心理** | 變態心理學、心理治療 | 病理層次（憂鬱、焦慮、思覺失調） |\n\n### 3️⃣ 從教科書目錄看（A → L）\n\n| 章 | 主題 | 對應的進階科目 |\n|----|------|---------------|\n| A | **緒論與研究方法** | — |\n| B | 心理學的**生物基礎** | 生理心理學 |\n| — | 統計、實驗法、測驗 | 方法學三科 |\n| — | 感覺與知覺 | 知覺心理學 |\n| — | 學習、記憶、思考、語言、動機、情緒、壓力、智力 | 認知心理學 |\n| — | 發展 | 發展心理學 |\n| — | 社心、人格、變態 | 社心、人格、變態心理學 |\n\n> 💡 變態心理學在課本通常分兩章：\n> 1. **心理疾病介紹**\n> 2. **心理疾病的治療**\n\n---\n\n## 三、新興主題（教科書未涵蓋）\n\n目前教科書多是十年前的翻譯本，以下四大新興議題很重要：\n\n### 1️⃣ 神經科學的發展\n\n- fMRI、EEG 的應用\n\n### 2️⃣ 正向心理學（Positive Psychology）\n\n- **Seligman 賽利格曼** 在 2000 年擔任美國心理學會主席時強力推動\n- 至今 20 多年，成為**顯學**\n- 核心理念：以前心理學太負面（都在談憂鬱、疾病），現在要研究人類的**優勢、美德、幸福感**\n- 從「把病人救起來變健康」→「幫助健康的人變得更好」\n- 常見練習：感恩練習、正向練習、樂觀練習\n\n### 3️⃣ 數位與科技的應用\n\n- **3C 產品** 進入考題\n- 發展心理學家關心：\n  - 小孩**幾歲**可以接觸 3C？\n  - 接觸**多久**會影響發展？\n- 近 7–8 年焦點轉變：「孩子已經在用了，**副作用**是什麼？」\n  - 社群使用 ↑ → 焦慮憂鬱 ↑\n\n#### 近三年火紅議題：AI\n\n- AI 做心理評估\n- VR 做治療訓練\n- 倫理議題：是否要**揭露對方是 AI / 不是真人**\n\n#### 數位科技 × 變態心理學\n\n- **網路成癮**（青少年問題嚴重，輔導老師十個有九個遇到）\n- 社群媒體（Facebook → IG → TikTok）對人際、情緒、人格的影響\n- 社群媒體靠「**朋友也在上面**」黏住使用者\n- 美國國會聽證會：Meta（祖克柏）等高階主管被問「你讓你的小孩用嗎？」→ 不能講謊話 → 答「**不讓**」→ 被追問「那為什麼賣給大家？」→ 答不出來\n\n### 4️⃣ 文化心理學\n\n#### 為什麼重要？\n\n- 過去（1930s–1980s）的人格、社心理論大多是**北美、歐洲一小撮人**做出來的實驗\n- 現在的學者反思：「這些研究適用於其他文化嗎？」\n- **文化敏感度** 已成為諮商、臨床、心理師執業倫理要求\n- 在台灣也會遇到新移民、新移民第二代等不同族群\n\n---\n\n## 四、心理學家 vs 其他學科：大象的例子 🐘\n\n> 一隻大象從山坡上滑下來。\n\n| 學科 | 關注點 |\n|------|--------|\n| **物理學家** | F = ma（推力、質量、加速度） |\n| **化學家** | 草地摩擦後釋放的化學分子 |\n| **心理學家** | 大象**怎麼想**？為什麼牠要滑？ |\n\n### 不同心理學派的解釋\n\n| 學派 | 解釋 |\n|------|------|\n| **發展心理學** | 小時候有過好的滑行經驗（早期童年經驗） |\n| **生理心理學** | 刺激行為 → 大腦分泌**多巴胺** → 感到愉悅 |\n| **知覺心理學** | 大象如何辨識下坡？深度知覺問題（參考嬰兒視崖實驗） |\n| **社會心理學** | 一群朋友在旁邊起鬨「下去！下去！」→ 行為改變（刑法上「三人以上加重竊盜」也有此原理） |\n| **人格心理學** | 看其在不同情境下的**一致性**；高冒險特質（Big Five 中的開放性） |\n| **變態心理學（精神分析）** | 佛洛伊德會說：內在有某種不滿足，想藉由滑行達到滿足 |\n\n> 👉 同一個行為，背後的解釋可以來自：**同儕、生理、家庭、經驗** 等不同來源 → 對應不同心理學科目。\n> 旁邊媽媽講十句，可能不如同學講一句有力（同儕影響的力量）。\n\n---\n\n## 五、心理學思潮的演變\n\n### 1️⃣ 起源：兩大父母\n\n| 父母 | 對應科目 |\n|------|----------|\n| **哲學**（3000 多年） | 認知（人類如何獲得知識） |\n| **生物學** | 知覺、生理心理學 |\n\n> 💬 **Ebbinghaus 艾賓豪斯**：「心理學有一個很長的歷史，但只有短短的過去。」\n\n### 2️⃣ 1879 — 科學心理學的誕生\n\n- 德國**萊比錫**，**Wundt 馮特** 建立第一個**研究**心理學實驗室\n- 雖然 1878 年 William James 在哈佛已建實驗室，但那是**教學用**，不算\n- 科學心理學從 1879 年從哲學脫離，獨立成科\n\n### 3️⃣ 19 世紀末 / 20 世紀初的三巨頭\n\n| 人物 | 主張 | 方法 |\n|------|------|------|\n| **Wundt 馮特** | **結構主義**：分析心智的結構（感覺、知覺、情緒等各為一個結構） | 內省法（分析） |\n| **William James 威廉詹姆斯** | **功能主義**：受達爾文演化論影響，問「這個心理歷程**有什麼功能**？」有用就留下 | 內省法（整體、現象學式）；意識像河流（**意識流**），不可分割 |\n| **Freud 佛洛伊德** | **精神分析之父**，開創潛意識 | 無實驗 |\n\n#### 佛洛伊德的核心理論\n\n- **人格結構**：本我、自我、超我\n- **人格動力**：生的本能、死的本能\n- **驅力**\n- 影響極深：發展、社心、人格、變態、認知；甚至影響文學與西方文化\n- 又稱「**動力心理學**」：因為驅力推動著你往前走\n\n> 💡 雖然常被批評不科學，但**沒有他就沒有後人**。\n\n### 4️⃣ 第三波：行為主義（Behaviorism）\n\n#### 起源與主張\n\n- 1913 年 **Watson 華生** 發表論文，反對 Freud 的「黑盒子」\n- 不談看不見的心智，**只談可觀察的刺激（輸入）與反應（輸出）**\n\n#### 核心概念（操作制約）\n\n| 結果 | 名稱 | 例子 |\n|------|------|------|\n| 行為**增加** | 增強物（Reinforcement） | 拍販賣機 → 掉飲料 → 下次更想拍 |\n| 行為**減少** | 懲罰（Punishment） | 拍販賣機 → 沒掉東西 → 慢慢不再拍 |\n\n#### 統治期\n\n- 1913 → 1956 約 **50 年**\n- 全部在談「黑盒子不重要」\n\n### 5️⃣ 第四波：人本主義（Humanism）\n\n- 1956 **Carl Rogers 卡爾羅傑斯** 提出\n- **第三勢力**（第一勢力 = 精神分析；第二勢力 = 行為主義）\n- 對行為主義與精神分析做反動\n\n#### 核心主張\n\n- 強調人的**尊嚴、潛能、自由選擇、自我實現**\n- 反對 Freud 把人說成夾在「生物本能（本我）」和「道德要求（超我）」中間苦苦掙扎的可憐三明治\n- 我們是有**主體性**、可以決定自己往哪走的人\n\n#### 影響\n\n- 人格心理學\n- 諮商輔導理論\n\n### 6️⃣ 第五波：認知革命（Cognitive Revolution）\n\n- 約 **1960 年代** 興起\n- 反對行為主義「不看黑盒子」\n- 重新關注內在心智歷程\n\n### 7️⃣ 思潮的「正反正反」\n\n| 階段 | 反對誰 | 焦點 |\n|------|-------|------|\n| 精神分析 | — | 只看內在 |\n| 行為主義 | 反精神分析 | 只看外在 |\n| 認知革命 | 反行為主義 | 又回到內在 |\n\n### 8️⃣ 重要理論時間軸\n\n| 學派 | 重點 |\n|------|------|\n| 心理動力論（精神分析） | 潛意識、人格結構 |\n| 行為主義 | 刺激—反應 |\n| 人本主義 | 自我實現（與認知年代相近） |\n| 認知 | 內在心智歷程 |\n| 生物 / 演化 | 從「生物父母」傳承下來 |\n| 社會文化 | 跨文化視角 |\n\n---\n\n## 六、心理學研究方法\n\n### 1️⃣ 觀察法\n\n- 不需把受試者帶進實驗室\n- 直接到現場觀察行為\n- 例：去幼兒園觀察小朋友是合作、落井下石、冷漠，還是有同理心（哭了去抱）\n\n### 2️⃣ 相關法\n\n- 蒐集兩個變項的關係\n- 例：上網時間 vs 學業成績；睡眠時間 vs 學業成績\n\n> ⚠️ **相關 ≠ 因果**（高頻考點）\n\n#### 易誤判的例子\n\n「大學生上網時間越長，憂鬱程度越高」\n\n- ❌ 不能直接說「上網**導致**憂鬱」\n- 可能解釋有三種：\n  1. 上網 → 憂鬱（原假設）\n  2. 憂鬱 → 上網（**反向因果**：因為憂鬱不想出門，所以上網更久）\n  3. **共同第三因**：例如某個基因同時影響「上網傾向」和「憂鬱傾向」\n\n> 💡 字面看起來合理 ≠ 真的有因果。睡眠時間少 → 學業差，看起來合理，但可能是身體有某個毛病同時影響睡眠和注意力。\n\n### 3️⃣ 實驗法\n\n#### 核心要素\n\n| 名稱 | 別名 | 角色 |\n|------|------|------|\n| 自變項（IV） | 獨變項 | **操弄**的變項 |\n| 依變項（DV） | 應變項 | 觀察的**結果** |\n\n> 英文：Independent Variable / Dependent Variable\n\n#### 例子：藥物實驗\n\n- 自變項：吃**藥物** vs 吃**安慰劑**\n- 依變項：病有沒有變好\n- 若兩組都變好 → 不是因果關係（可能是安慰劑效應）\n\n> 💡 安慰劑效應約佔 30%——光是「去看醫生」這個動作本身就有療效。\n\n### 4️⃣ 個案研究（Case Study）\n\n- 對某一個案做深入長期追蹤（例 10–20 年）\n- **Piaget 皮亞傑** 的個案研究對象都是**他自己的小孩**\n\n> 💡 一般碩士畢業很少做個案研究，多做問卷（相關法）或實驗法。\n\n---\n\n## 七、心理學分析的六大層次\n\n### 從小到大排列\n\n| # | 層次 | 例子 |\n|---|------|------|\n| 1 | **分子** | Eric Kandel（2000 年諾貝爾生醫獎）海蝸牛神經細胞分子層次實驗 |\n| 2 | **神經化學** | 神經傳導物質（血清素、多巴胺） |\n| 3 | **神經結構（大腦）** | 額葉、頂葉、下視丘、杏仁核、海馬迴 |\n| 4 | **認知** | 認知理論（如風險決策框架效應） |\n| 5 | **行為** | 同一行為背後可有多種解釋（認知、社會、發展） |\n| 6 | **社會** | 文化、法律、個人主義 vs 集體主義 |\n\n### 認知層次的例子：風險決策框架效應\n\n#### 情境 A（獲得框架）\n\n| 選項 | 結果 | 期望值 |\n|------|------|--------|\n| 不猜 | +100 確定 | +100 |\n| 猜（50/50） | 猜對 +200，猜錯 −100 | +100（同） |\n\n> 👉 **大部分人選不猜**（保守，避免損失）\n\n#### 情境 B（損失框架）\n\n| 選項 | 結果 | 期望值 |\n|------|------|--------|\n| 不猜 | −100 確定 | −100 |\n| 猜（50/50） | 猜對 0，猜錯 −200 | −100（同） |\n\n> 👉 **大部分人選猜**（賭一把，搏不損失）\n\n> 💡 **獲得時保守，損失時冒險**。期望值相同，但決策不同——這就是認知層次的解釋。\n\n### ⚠️ 關鍵原則：不要跨層次解釋\n\n- 在分子層次做的實驗 → 結論留在分子層次\n- 在 fMRI 看到「快樂時某處發亮」→ 結論留在大腦層次\n- **不要直接跳到「所以行為上應該怎麼做」**——跳得太遠\n\n> 💡 這個原則在後續神經科學實驗中會反覆強調。\n\n---\n\n## 🎯 本堂核心總結\n\n### 心理學的全貌\n\n- **內容**：四大金剛（知覺、認知、社心、人格）+ 發展、生理、變態、諮商\n- **新興**：神經科學、正向心理學、數位科技、文化心理學\n- **特色**：和其他學科不同——關心「人類怎麼想」\n\n### 思潮演變的「正反辯證」\n\n```\n精神分析（內）→ 行為主義（外）→ 認知革命（內）\n                ↘ 人本主義（第三勢力）\n```\n\n### 研究方法\n\n- 觀察、相關、實驗、個案\n- **相關 ≠ 因果**（最重要！）\n\n### 分析層次\n\n- 分子 → 神經化學 → 大腦 → 認知 → 行為 → 社會\n- **不要跨層次解釋**", "2026-04-20 16-50-20-教育測驗-信度.md": "# 📘 心理測驗｜信度（Reliability）上課整理筆記\n## 科目：教育測驗\n> 📍 範圍：講義 P.42 起｜古典測驗理論 → 信度的定義 → 信度的估計\n\n---\n\n## 一、開場提醒：備考心法\n\n- 考試是一場**馬拉松** → 一開始不要跑太快\n- 9–10 月：把握**穩健的腳步**，平均地讀完三大科\n- ⭐ 諮商所考試的決勝關鍵：**統計、測驗、研究法**\n  - 諮商理論大家程度差不多\n  - 真正分高下的是這三科\n- 國北等競爭激烈的學校 → **測驗**是非常重要的科目\n- 考試期間記得**充足飲食、睡眠**\n\n---\n\n## 二、什麼是信度？\n\n### 1️⃣ 字面意義\n\n> **信** = 信賴、可信\n>\n> **信度** = 一個測驗 / 測量 / 結果**讓人可以相信的程度**\n\n- 不一定要準確，但結果不會差太多\n\n### 2️⃣ 體重計的例子\n\n一個體重計：\n\n- 今天量 60 kg\n- 明天量 55 kg\n- 後天量 65 kg\n\n> 👉 這個體重計**沒有信度**——同樣的東西（你的真實體重），測出來卻每次差很多。\n\n### 3️⃣ 為什麼考試會擔心信度？\n\n可能影響考試表現的因素：\n\n- 改卷老師批改第 1 份 vs 第 100 份的標準是否一致？\n- 考試當天突發的身體不舒服（拉肚子、肚子餓）\n- 隔壁同學一直發出怪聲\n\n> 👉 這些都會讓你的成績**無法準確反映你的實力**。\n\n---\n\n## 三、古典測驗理論（Classical Test Theory, CTT）\n\n> 又稱**真分數理論**：以**真分數**與**實得分數**的關聯性為基礎的測驗理論。\n\n### 1️⃣ 兩個關鍵詞\n\n| 名稱 | 意義 |\n|------|------|\n| **真分數（True Score, T）** | 你**真實的實力** |\n| **實得分數（Observed Score, X）** | 你在這份測驗上**實際拿到**的分數 |\n\n### 2️⃣ 核心公式\n\n$$X = T + E$$\n\n| 符號 | 意義 |\n|------|------|\n| **X** | 實得分數（Observed） |\n| **T** | 真分數（True） |\n| **E** | 誤差（Error） |\n\n> ⚠️ 注意：加號兩邊看似都是「正」，但 **誤差 E 可以是負的**——測驗可能高估也可能低估你的實力。\n\n### 3️⃣ 範例：四位學生的數學模擬考\n\n| 學生 | 真分數 (T) | 實得分數 (X) | 誤差 (E) | 高估/低估/準確 |\n|------|-----------|-------------|---------|-----------------|\n| 甲 | 68 | 70 | +2 | 高估 |\n| 乙 | 58 | 55 | −3 | 低估 |\n| 丙 | 77 | 82 | +5 | 高估 |\n| 丁 | 43 | 43 | 0 | 準確 |\n\n### 4️⃣ 真分數從哪裡來？\n\n> 假設一位「萬年考生」考了 10 年諮商心理學 → 得到 10 個實得分數\n>\n> 這 10 個分數的**平均**就會接近他的真分數。\n\n$$T = E(X)$$\n\n- 真分數 = 實得分數的**期望值**\n- 在實務上**無法真的測無限多次**\n- 👉 所以真分數是一個**理論值**，永遠碰不到，但它在那邊\n- 我們在實務中能拿到的只有：**實得分數** + **誤差**\n\n---\n\n## 四、古典測驗理論的三個假設\n\n### 假設 1：個別受試者的實得分數平均 = 真分數\n\n$$T = E(X)$$\n\n#### 不成立會怎樣？\n\n假設「假同學」考了 10 次，每次誤差加總 = +10（不為 0）\n\n- → 他平均每次都被高估 1 分\n- → 那「真分數 = 65」就值得懷疑\n- → 真分數可能本來就是 66\n\n> 👉 這就是**數感**：當建立理論時，數字告訴你「這邊不對勁」，要相信這種感覺。\n\n### 假設 2：所有受試者在某次測驗中，誤差總和為 0\n\n> 同一間教室裡所有人的誤差加起來 = 0。\n\n#### 不成立會怎樣？\n\n假設一間教室所有人的誤差總和 = +10\n\n- 平均每人多拿 1 分\n- 👉 可能有作弊、冷氣較涼、風水較好等共同因素\n- → 信度有問題\n\n> 👉 假設 2 描述的是：**有人多拿、有人少拿，最後互相抵銷**。\n\n### 假設 3：真分數與誤差分數的相關 = 0\n\n$$\\rho(T, E) = 0$$\n\n意義：\n\n- 真分數高的人 ≠ 誤差也高\n- **不會有「實力越強的人越容易被高估」這種狀況**\n- 真分數和誤差**沒有任何關聯**\n\n### 假設 4（複本延伸）：兩次測驗間的誤差相關 = 0\n\n當對同一群學生**施測兩次**或施測**兩個複本**：\n\n- 第一次測驗的真分數 與 第二次測驗的誤差分數 → 相關 = 0\n- 第一次的誤差 與 第二次的誤差 → 相關 = 0\n\n> 💡 這個假設是後面**推導公式**時會用到，現在先放著。\n\n---\n\n## 五、複本（Parallel Forms）是什麼？\n\n> 同一份測驗考的**概念一樣**，但**數字 / 題目敘述不同**。\n\n### 數學例子\n\n| 前測 | 後測 | 概念 |\n|------|------|------|\n| X − 3 = 10 | Y + 5 = 17 | 一元一次方程式 |\n| 2X + 6 = 24 | 3Y − 3 = 21 | 一元一次（含乘除） |\n\n### 諮商例子\n\n| 前測 | 後測 | 概念 |\n|------|------|------|\n| 「投射」是什麼？ | 「合理化」是什麼？ | 防衛機制 |\n\n> 👉 同一組概念裡，題目可以替換但測的東西一樣。\n\n---\n\n## 六、相關（Correlation）複習\n\n### 1️⃣ 用例子建立感覺：氣溫 vs 飲料銷量\n\n兩家飲料店都記錄「氣溫 vs 賣的杯數」：\n\n| 我的店 | 朋友的店 |\n|--------|----------|\n| 點散布、不太成線 | 點分布很接近一條線 |\n| 看不出明確規律 | 氣溫高 → 杯數高 |\n\n> 👉 **相關** = 兩個變項是否「**一起變動**」、是否「**接近一條直線**」\n\n### 2️⃣ ⚠️ 相關 ≠ 因果\n\n- 不能因為「上網時間↑、憂鬱↑」就說「上網**造成**憂鬱」\n- 可能是反向因果，或有共同第三因\n\n### 3️⃣ 相關係數的公式\n\n#### 最簡單的形式\n\n$$r = \\frac{1}{N}\\sum Z_X \\cdot Z_Y$$\n\n其中 $Z_X, Z_Y$ 是 X 和 Y 的**標準分數**。\n\n> 👉 相關 = X 標準分數 × Y 標準分數的**平均**。\n\n#### 推導：怎麼變成常見的公式？\n\n**第一步：把標準分數還原**\n\n$$Z_X = \\frac{X - \\bar{X}}{S_X}, \\quad Z_Y = \\frac{Y - \\bar{Y}}{S_Y}$$\n\n**第二步：標準差是常數，可以提到 ∑ 外**\n\n$$r = \\frac{1}{N \\cdot S_X \\cdot S_Y} \\sum (X - \\bar{X})(Y - \\bar{Y})$$\n\n**第三步：把 N 放回去**\n\n$$r = \\frac{\\frac{1}{N}\\sum(X - \\bar{X})(Y - \\bar{Y})}{S_X \\cdot S_Y} = \\frac{Cov(X, Y)}{S_X \\cdot S_Y}$$\n\n> 👉 分子就是**共變數（Covariance）**\n\n### 4️⃣ 視覺化記憶法\n\n把資料點分成四象限（用 X̄、Ȳ 兩條線切開）：\n\n| 象限 | X 偏差 | Y 偏差 | 乘積 |\n|------|--------|--------|------|\n| 第一象限 | + | + | + |\n| 第三象限 | − | − | + |\n| 第二象限 | − | + | − |\n| 第四象限 | + | − | − |\n\n- 1、3 象限的點越多 → 相關 ↑（接近正斜線）\n- 2、4 象限的點越多 → 負相關\n- 平均分布 → 相關接近 0\n\n---\n\n## 七、信度的定義\n\n### 1️⃣ 信度有兩個面向\n\n| 面向 | 意義 |\n|------|------|\n| **一致性（Consistency）** | 兩次結果差不多；題目內部不矛盾 |\n| **穩定性（Stability）** | 不受**時間**影響；前後測結果一致 |\n\n### 2️⃣ 從哪一個分數可以看出信度？\n\n> 課堂上問：實得分數、真分數、誤差分數，哪一個能看出信度？\n\n#### 答案：**誤差分數** ⭐\n\n#### 理由\n\n- **真分數**：實力本身，跟測驗無關（沒有測驗，實力也存在）\n- **實得分數**：受到太多其他因素影響\n- **誤差分數**：直接反映測驗的「不一致」與「不穩定」程度\n\n#### 範例\n\n理想中的誤差分數：±1、±2、±2、−1、+1（**小、穩定**）\n\n不好的測驗：+10、+20、−30、+5、−15（**波動大**）\n\n> 👉 誤差分數的**變異數**越大 → 測驗越不可信\n\n---\n\n## 八、為什麼不能只用誤差變異數？\n\n### 1️⃣ 反例：分數計算錯誤\n\n老師原本用「每題 1 分」改卷，後來發現應該是「每題 2 分」：\n\n- 所有 X、T、E 都翻倍\n- 變異數會變成 **4 倍**（因為變異數是平方關係）\n\n#### 問題\n\n- 測驗本身的一致性、穩定性**沒有改變**\n- 只是配分換算錯了\n- 但誤差變異數卻變成 4 倍 → 顯示「信度變差」？\n\n> ❌ 這顯然不合理。\n\n### 2️⃣ 解法：除以實得分數的變異數\n\n$$\\frac{S_E^2}{S_X^2}$$\n\n- 改前：17.4 / 7.4\n- 改後：69.6 / 29.6\n- 👉 兩者**比例相同**（都被 4 倍抵銷）\n\n> ✅ 用「比例」來消除測量尺度改變的影響。\n\n### 3️⃣ 還有一個問題：方向相反\n\n- 這個比例**越大** → 測驗**越不可信**\n- 但我們希望「信度的數值越大 = 越可信」\n\n#### 解法：用「1 減去它」\n\n$$\\text{信度} = 1 - \\frac{S_E^2}{S_X^2}$$\n\n---\n\n## 九、信度的正式定義\n\n### 1️⃣ 從變異數拆解出發\n\n由 X = T + E，且根據假設 ρ(T, E) = 0：\n\n$$S_X^2 = S_T^2 + S_E^2$$\n\n> 💡 兩邊變異數可以直接相加，因為真分數和誤差不相關（否則還要加 2·Cov 項）。\n\n### 2️⃣ 推導信度公式\n\n兩邊除以 $S_X^2$：\n\n$$1 = \\frac{S_T^2}{S_X^2} + \\frac{S_E^2}{S_X^2}$$\n\n整理得：\n\n$$\\frac{S_T^2}{S_X^2} = 1 - \\frac{S_E^2}{S_X^2}$$\n\n### 3️⃣ ⭐ 信度的定義式\n\n$$\\boxed{\\text{信度} = \\frac{S_T^2}{S_X^2}}$$\n\n> **信度 = 實得分數的變異數中，由真分數的變異數所佔的比例**\n\n#### 特性\n\n- 數值在 0 到 1 之間\n- **越大 → 信度越高**\n- 不受配分尺度改變影響\n\n---\n\n## 十、信度估計：理論 vs 實務\n\n### 1️⃣ 為什麼要估計？\n\n- 信度的定義式裡有 $S_T^2$（真分數的變異數）\n- 真分數是**理論值**，永遠拿不到\n- 👉 所以信度的定義式**無法直接操作計算**\n\n### 2️⃣ 唯一能做的：估計\n\n> 既然算不出來真值，我們就用其他方法**估計**它。\n\n### 3️⃣ 最常見的估計方法：複本/再測法\n\n#### 步驟\n\n1. 今天（X1）：把測驗給大家做一次 → 得到一組實得分數\n2. 明天（X2）：把同一份測驗或複本再給大家做一次 → 得到另一組實得分數\n3. 計算 X1 和 X2 的**相關係數**\n\n$$\\hat{r}_{XX'} \\approx \\rho(X_1, X_2)$$\n\n> ⚠️ 用「箭頭」而非「等號」——這是**估計**。\n\n#### 為什麼這樣有道理？\n\n把 (X1, X2) 畫成散布圖：\n\n- **信度高** → 散布圖接近直線\n  - 高分組今天高分，明天也高分\n  - 低分組今天低分，明天也低分\n- 👉 前後測結果具有**一致性與穩定性** → 表示測驗可信\n\n### 4️⃣ 後續會講的其他估計方法\n\n- 再測信度\n- 複本信度\n- 內部一致性（α 係數等）\n- ……\n\n---\n\n## 🎯 核心重點回顧\n\n### 必背公式\n\n| 名稱 | 公式 |\n|------|------|\n| 古典測驗理論 | $X = T + E$ |\n| 變異數拆解 | $S_X^2 = S_T^2 + S_E^2$ |\n| **信度定義** | $\\text{信度} = \\dfrac{S_T^2}{S_X^2} = 1 - \\dfrac{S_E^2}{S_X^2}$ |\n\n### 三大假設\n\n1. 個別受試者實得分數平均 = 真分數\n2. 全體受試者誤差總和 = 0\n3. 真分數與誤差分數相關 = 0\n\n### 學習路徑\n\n> 📍 **如果暫時看不懂推導**：把**信度的定義式**背起來就好，前面的推導之後再回來補。\n\n> 📍 **如果有餘裕**：理解推導過程，會建立扎實的「數感」，對統計與測驗都有幫助。\n", "2026-04-20 18-14-17-統計-變項.md": "# 📘 統計學｜資料與變項 上課整理筆記\n## 科目：統計\n\n> 📍 範圍：1-3 資料與變項｜變項的分類系統\n\n---\n\n## 一、核心理念\n\n> 統計就是在**分析資料**，就是在**分析變項**。\n> 所以我們必須先對「資料」與「變項」有基本認識。\n\n---\n\n## 二、變項的兩套分類系統\n\n### 1️⃣ 連續變項 vs 間斷變項\n\n### 2️⃣ Stevens 四種尺度（根據**量化程度**分類）\n\n| 尺度 | 英文 | 量化程度 |\n|------|------|---------|\n| 名義 | Nominal | 最低（無量的概念） |\n| 次序 | Ordinal | 較低 |\n| 等距 | Interval | 較高 |\n| 比率 | Ratio | 最高 |\n\n### 3️⃣ 自變項 / 依變項（實驗角色分類）\n\n- 自變項（Independent Variable, IV）\n- 依變項（Dependent Variable, DV）\n- 中介變項（Mediator）\n- 調節變項（Moderator）\n- 共變項（Covariate）\n- 第三變項（Third Variable）\n\n---\n\n## 三、什麼是變項（Variable）？\n\n### 1️⃣ 定義\n\n> **變項**：一群**可以不同**的數值或類別所出現改變的一種屬性。\n\n- 關鍵字：「**可以變化**」\n- 例子：身高、血型、年齡、體重、態度\n\n### 2️⃣ 變項 vs 常數項\n\n#### 變項（Variable）\n\n- 全班每個人的體重都不一樣 → 是**變項**\n- 性別用 1、2 編碼 → 只有 1、2 在變 → 仍是**變項**\n\n#### 常數項（Constant）\n\n> 一個**不會變化**的值。\n\n- π（圓周率）= 3.14… → 所有人都一樣\n- 一天有 24 小時 → 所有人都一樣\n\n#### 經典考題\n\n> 「性別」在**北一女**（Taipei First Girls' High School）這間學校裡是什麼？\n\n- 答案：**常數項**\n- 因為北一女只收女生，性別全部都是「女」 → 不會變\n\n### 3️⃣ 為什麼要研究變項？\n\n> 常數項**沒有研究的意義**，因為它不會變。\n\n- 沒有論文會研究「睡眠次數 vs 一天幾小時」的關聯性\n- 因為一天的小時數是固定的（常數）\n- 研究的目的就是找出「**變的原因**」：什麼時候高？什麼時候低？\n\n### 4️⃣ 統計學最重要的概念：**變異（Variance）**\n\n> 如果一個參數完全沒有變異 → 它就是常數項 → 沒有研究必要。\n\n---\n\n## 四、連續變項 vs 間斷變項\n\n### 1️⃣ 連續變項（Continuous Variable）\n\n#### 定義\n\n> 在連續尺規上討論的變項；**任兩點之間都可以再找到第三點**。\n\n#### 特徵\n\n- 可以**無限往下切**\n- 任何一個數字代表的是**一段距離**（不是一個點）\n\n#### 範例：身高 173 公分\n\n- 173 其實代表 **172.5 ~ 173.5** 之間的範圍\n- 173.5 代表 173.45 ~ 173.55\n- 可以繼續切下去：173.55 代表 173.545 ~ 173.555……永遠切不完\n\n#### 切割規則\n\n> 找到目前單位的**最小位階**，再往下一個位階的 **5**。\n\n| 數字 | 代表範圍 |\n|------|---------|\n| 173 | 172.5 ~ 173.5 |\n| 173.5 | 173.45 ~ 173.55 |\n| 173.55 | 173.545 ~ 173.555 |\n\n### 2️⃣ 間斷變項（Discrete Variable）\n\n#### 定義\n\n> 不是連續的尺規；**找不到第三點，也切不下去**。\n\n#### 特徵\n\n- 數字代表**一個精確的點**，不是一段距離\n- 不可切割\n\n#### 範例\n\n| 變項 | 為什麼是間斷 |\n|------|-------------|\n| 材質 | 1 點就是 1 點，沒有 0.5 點 |\n| 人數 | 「我交過 3.8 個女朋友」不合邏輯 |\n| 次數 | 無法切割 |\n| 選票 | 就是一張一張的 |\n\n### 3️⃣ ⚠️ 理論 vs 實務的彈性\n\n- **邏輯/學理上**：連續與間斷有明確定義（能否找第三點）\n- **實務使用上**：兩者的分野沒那麼清楚\n  - 人數少 → 當作間斷變項使用\n  - 人數多 → 當作連續變項使用\n\n---\n\n## 五、Stevens 四種尺度（量化程度的階層）\n\n### 1️⃣ 階層概念圖\n\n```\n      ↑  Ratio（比率）     ── 絕對零點\n      │  Interval（等距）  ── 等距\n      │  Ordinal（次序）   ── 排序\n      │  Nominal（名義）   ── 分類\n```\n\n> 💡 像 Maslow 需求層次一樣：**越往上越厲害**，上層擁有下層**所有**的特性。\n\n### 2️⃣ 質 vs 量的分界\n\n| 層級 | 資料類型 | 數學運算 |\n|------|---------|---------|\n| Nominal | 質的變項 | 不能做運算 |\n| Ordinal | 質的變項 | 不能做運算 |\n| **Interval** | 量的變項 | **可以加減** |\n| **Ratio** | 量的變項 | **可以乘除** |\n\n> 💡 到了 Interval 以上就當作「量的概念」，Interval vs Ratio 的差別有時沒那麼重要。\n\n### 3️⃣ 數字的意義\n\n> 數字本身沒有太多意義，**我們必須賦予數字意義**。\n\n- 例：E110、E114、E118 → 可能是地區號（Nominal），也可能是成績（可能是 Interval）\n- 例：球衣 4 號、5 號、6 號 → 代表**不同的人**（Nominal）\n\n---\n\n## 六、Nominal（名義變項）\n\n### 定義\n\n> 用數字代表**某一個類別**，功能是「**分類**」。\n\n### 關鍵字：**分類**\n\n- 男生 = 1，女生 = 0\n- 1 和 0 沒有大小、強弱之分\n- 只代表**不同族群**\n\n### 特性\n\n#### 互斥\n\n- 如果男生是 1，女生就**不能也是 1**\n- 每個對象**只能歸在一類**\n\n#### 數字只是符號\n\n- 男生 = 1，女生可以是 0、−1、9、8、3……隨便\n- 只要跟 1 不同就好\n\n#### 判斷邏輯\n\n- 相同數字 → 同類\n- 不同數字 → 異類\n\n### 範例\n\n- 性別、學號、血型、地區號、球衣號碼、職業別、身分證字號\n\n### 身分證字號的反例\n\n> 身分證字號那串數字**不能拿來比大小**。\n\n- 它只代表你跟別人不一樣\n- 沒有大小之分\n\n---\n\n## 七、Ordinal（次序變項）\n\n### 定義\n\n> 根據某種標準，按照排定順序、大小、高低、等第，用數字表示。\n\n### 關鍵字：**排序**\n\n- 第 1 名、第 2 名、第 3 名\n- 數字除了代表不同的人，還表達**高低優劣的順序**\n\n### ⚠️ 但**不等距**\n\n> 第 1 名 90 分，第 2 名 67 分，第 3 名 65 分\n\n- 1→2 的差距很大（23 分）\n- 2→3 的差距很小（2 分）\n- 排序存在 ✅\n- 等距性 ❌\n\n### 範例\n\n- 名次、職位、態度評定表\n\n### 標示不同數字的人\n\n- 在某個特性上具有**不相等**的性質\n- 例：我第一名、你第二名 → 我們能力有差異\n\n---\n\n## 八、Interval（等距變項）\n\n### 定義\n\n> 數值之間的差異具有**相同的等距**。\n\n### 關鍵字：**等距**\n\n### 範例：攝氏溫度\n\n- 5°C、10°C、15°C\n- 5°C 到 10°C 是 5 個刻度\n- 10°C 到 15°C 也是 5 個刻度\n- 👉 這個「5」等於那個「5」\n\n### 特性\n\n- 具有**類別**（Nominal）\n- 具有**高低**（Ordinal）\n- 具有**等距**：可以做**加減**運算\n- **沒有絕對零點**\n\n### ⚠️ 沒有絕對零點\n\n> 攝氏的 0°C 是**人為定義**的：\n> 「一大氣壓下，水從液態變固態的那個點」\n\n- 沒有人類之前，沒有「0°C」這個概念\n- 所以不是物理上存在的零點\n\n### 範例\n\n- 攝氏溫度、華氏溫度、智力測驗分數\n\n---\n\n## 九、Ratio（比率變項）\n\n### 定義\n\n> 除了具有 Interval 的特性外，還有**絕對零點**。\n\n### 關鍵字：**絕對零點**\n\n### 絕對零點 = 「零 = 沒有（無）」\n\n> 問自己：這個量尺上的零，是不是代表「無」、「沒有」？\n\n| 量尺 | 零的意義 | 是 Ratio 嗎？ |\n|------|---------|--------------|\n| 絕對溫度 K | 沒有能量、沒有熱量 | ✅ 是 |\n| 重量（公斤） | 沒有重量 | ✅ 是 |\n| 長度（公分） | 沒有距離 | ✅ 是 |\n| 魏氏智力測驗 | 沒有智力？ | ❌ **不是** |\n| 幸福感 | 沒有幸福感？ | ❌ 不是 |\n| 統計考試 | 沒有統計能力？ | ❌ 不是 |\n\n### 絕對零點的判斷原則\n\n1. 零是否代表「**無**」？\n2. 這個零是否**不可撼動**？\n3. 這個零是否為**物理性的存在**（非人為定義）？\n\n若三者皆是 → 就是 Ratio。\n\n### 特性\n\n- 具有所有下層尺度的特性\n- 可以做**乘除**運算\n\n#### 範例\n\n> 15 kg 是 5 kg 的 **3 倍** ✅（乘除成立）\n\n### 範例變項\n\n- 絕對溫度（K）、身高、體重\n\n### 💡 心理學為什麼很難有 Ratio？\n\n- 心理學概念大多是**人為定義**的\n- 所以很難有真正的**絕對零點**\n- 這是心理學界的「千古之謎」——大家視而不見\n\n#### 魏氏智力測驗零分案例\n\n- 三歲小孩做成人魏氏測驗 → 會測出 0 分\n- 但不代表她沒有智力，而是題目太難（在詞歸範圍之外）\n- 👉 零分代表「**智力很低**」，不代表「沒有智力」\n\n---\n\n## 十、亮度範例：同一個概念，不同量尺\n\n> 「亮度」是什麼尺度？\n\n這其實無法直接回答，因為「亮度」是一個**概念**，但我們有不同的量尺可以衡量：\n\n| 量尺 | 特性 | Stevens 層級 |\n|------|------|-------------|\n| **瓦數（Watts）** | 物理能量，0 瓦 = 沒能量 | Ratio |\n| **燭光** | 物理單位 | 通常是 Ratio |\n| **知覺亮度** | 個人的感受 | 可能連 Interval 都不到 |\n\n### 知覺亮度的反例\n\n- 把教室全關燈 → 全黑 → 打一個打火機\n- 教室日光燈全開 → 打一個打火機\n\n> 同樣的燭火，心裡感受完全不同 → 不符合等距。\n\n### 💡 延伸議題：心理物理學（Psychophysics）\n\n- 研究「外在物理尺度」與「心理感知尺度」的對應關係\n- 例：電視音量從 0 調到 10，每一格的物理強度差異**相等**，但**心理感受**可能不等距\n\n---\n\n## 十一、四大尺度總整理表\n\n| 尺度 | 同質性 | 不等性 | 可加減 | 可乘除 | 資料類型 | 例子 | 分析方法 |\n|------|--------|--------|--------|--------|---------|------|---------|\n| Nominal | ✅ | ❌ | ❌ | ❌ | 質 | 性別、血型 | 無母數分析 |\n| Ordinal | ✅ | ✅ | ❌ | ❌ | 質 | 名次、職位 | 無母數分析 |\n| Interval | ✅ | ✅ | ✅ | ❌ | 量 | 攝氏溫度、智商 | 有母數分析 |\n| Ratio | ✅ | ✅ | ✅ | ✅ | 量 | 身高、體重、絕對溫度 | 有母數分析 |\n\n### 降階可行，升階不可行\n\n> 高階可降階，低階不可升階。\n\n---\n\n## 十二、經典考題：Likert 量表的尺度歸屬\n\n### 題目（師大考了兩三次）\n\n> 李克特氏量表（Likert scale）被當作什麼量尺？\n\n### 什麼是 Likert 量表？\n\n> 最常見的問卷量尺：「同意度評定法」\n\n| 分數 | 意義 |\n|------|------|\n| 1 | 非常不同意 |\n| 2 | 不同意 |\n| 3 | 普通 |\n| 4 | 同意 |\n| 5 | 非常同意 |\n\n### 分析\n\n#### 是 Ratio 嗎？\n\n- 填 1 分不代表「**沒有**喜歡」\n- ❌ 不是 Ratio\n\n#### 是 Interval 嗎？\n\n> 你敢保證 1→2、2→3、3→4、4→5 的心理差異都一樣嗎？\n\n#### ⚠️ 華人文化的扭曲\n\n- 心理計量研究顯示：Likert 量表**在心理上不是等距**\n- 華人文化中：\n  - 很少有人填極端值（1 或 5）\n  - 就算熱愛到爆炸，也不會填 5\n  - 即使討厭到極點，也不會填 1\n- 真實的心理感受會扭曲成：\n  - 1、5 的距離被壓縮\n  - 2、3、4 的差異被放大\n\n#### 你的 1 = 隔壁同學的 1 嗎？\n\n- 兩人都填 1，討厭程度未必相同\n- 👉 無法保證等距\n\n### 答案\n\n| 層次 | 判定 |\n|------|------|\n| **理論上** | **Ordinal（次序變項）** |\n| **實務上** | 當作 **Interval 或以上**使用 |\n\n### 為什麼實務上當 Interval 使用？\n\n> 如果要把全班的 Likert 分數**加總平均** → 這個「加」的動作至少要在 Interval 以上。\n\n所以實務操作上，大家默認它是等距的。\n\n---\n\n## 🎯 核心重點回顧\n\n### 變項 vs 常數項\n\n- 會變的才叫變項，才有研究意義\n- **變異**是統計學最重要的概念\n\n### 兩套分類系統\n\n1. **連續 vs 間斷**（能否找第三點）\n2. **Stevens 四尺度**（Nominal → Ordinal → Interval → Ratio）\n\n### Stevens 四尺度的關鍵字\n\n| 尺度 | 關鍵字 | 可做的運算 |\n|------|--------|-----------|\n| Ratio | 絕對零點 | 加減乘除 |\n| Interval | 等距 | 加減 |\n| Ordinal | 排序 | — |\n| Nominal | 分類 | — |\n\n### 心理學的特殊性\n\n- 很難有 Ratio（大多概念是人為定義）\n- Likert 量表理論上是 Ordinal，實務上當 Interval 用\n\n### 判斷絕對零點的口訣\n\n> 「**這個零，是不是代表沒有？**」\n"};
const FIRST_NOTE    = "2026-04-20 13-01-21-量化研究方法.md";

const SUBJECT_ICONS = {
  education:     "📊",
  psychology:    "🧠",
  counseling:    "💬",
  english:       "📝",
  uncategorized: "📄",
};

const SUBJECT_LABELS = {
  education:     "教育研究法",
  psychology:    "普通心理學",
  counseling:    "輔導原理",
  english:       "英文",
  uncategorized: "未分類",
};

// ── Build sidebar ──
function buildSidebar() {
  const sidebar = document.getElementById("sidebar");
  SIDEBAR_DATA.forEach(subj => {
    const div = document.createElement("div");
    div.className = "sidebar-subject";
    div.dataset.id = subj.id;

    // Check if has nested categories
    const hasCategories = subj.categories && subj.categories.length > 0;
    const notesHtml = hasCategories
      ? subj.categories.map(cat => `
        <div class="sidebar-category">
          <div class="category-header" onclick="toggleCategory(event, '${cat.id}')">
            <span class="category-name">${cat.name}</span>
            <span class="category-toggle">▼</span>
          </div>
          <div class="category-notes" id="cat-${cat.id}">
            ${cat.notes.map(n => `
              <a class="note-link" data-filename="${n.filename}" onclick="loadNote('${n.filename}', '${subj.id}', '${subj.name}')">
                ${n.title}
                ${n.date ? `<span class="note-date">${n.date}</span>` : ""}
              </a>
            `).join("")}
          </div>
        </div>
      `).join("")
      : (subj.notes || []).map(n => `
        <a class="note-link" data-filename="${n.filename}" onclick="loadNote('${n.filename}', '${subj.id}', '${subj.name}')">
          ${n.title}
          ${n.date ? `<span class="note-date">${n.date}</span>` : ""}
        </a>
      `).join("");

    div.innerHTML = `
      <div class="sidebar-subject-header" onclick="toggleSubject('${subj.id}')">
        <div class="subject-icon icon-${subj.id}">${SUBJECT_ICONS[subj.id] || "📄"}</div>
        <div class="subject-label">
          <span class="subject-name">${subj.name}</span>
          ${subj.sub ? `<span class="subject-sub">${subj.sub}</span>` : ""}
        </div>
        <span class="subject-toggle">▶</span>
      </div>
      <div class="sidebar-notes">
        ${notesHtml}
      </div>
    `;
    sidebar.appendChild(div);
  });
}

function toggleSubject(id) {
  const el = document.querySelector(`.sidebar-subject[data-id="${id}"]`);
  if (el) el.classList.toggle("open");
}

// Toggle nested category
function toggleCategory(event, catId) {
  event.stopPropagation();
  const catNotes = document.getElementById(`cat-${catId}`);
  const toggle = event.currentTarget.querySelector(".category-toggle");
  if (catNotes) {
    catNotes.classList.toggle("open");
    toggle.textContent = catNotes.classList.contains("open") ? "▼" : "▶";
  }
}

function loadNote(filename, subjectId, subjectName) {
  document.querySelectorAll(".note-link").forEach(l => l.classList.remove("active"));
  const link = document.querySelector(`.note-link[data-filename="${filename}"]`);
  if (link) link.classList.add("active");

  let md = NOTES_CONTENT[filename] || "（筆記內容載入失敗）";

  // Protect math formulas from marked.js, then render with KaTeX
  const mathStore = new Map();
  let mathCounter = 0;
  md = md.replace(/\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$/g, (match) => {
    const key = `XMATHX${mathCounter++}XMATHX`;
    mathStore.set(key, match);
    return key;
  });

  let html = marked.parse(md);

  // Replace placeholders with KaTeX-rendered HTML
  mathStore.forEach((formula, key) => {
    const isDisplay = formula.startsWith('$$');
    const inner = isDisplay ? formula.slice(2, -2) : formula.slice(1, -1);
    let rendered;
    try {
      rendered = katex.renderToString(inner, { displayMode: isDisplay, throwOnError: false });
    } catch (e) {
      rendered = formula;
    }
    html = html.replace(new RegExp(key, 'g'), rendered);
  });

  // Add IDs to headings for TOC navigation
  const headingRegex = /<h([1-6])(.*?)>(.*?)<\/h\1>/g;
  let headingId = 0;
  html = html.replace(headingRegex, (match, level, attrs, content) => {
    const id = `heading-${headingId++}`;
    return `<h${level} id="${id}"${attrs}>${content}</h${level}>`;
  });

  document.getElementById("main").innerHTML = `
    <div class="note-title-bar">
      <span class="note-subject-tag ${subjectId}">${subjectName}</span>
    </div>
    <div class="content">${html}</div>
    <div class="mindmap-section" id="mindmap-section">
      <div class="mindmap-header">
        <h2>📊 心智圖</h2>
        <button class="mindmap-toggle" id="mindmap-toggle" onclick="toggleMindMap()">展開心智圖</button>
      </div>
      <div class="mindmap-wrap" id="mindmap-wrap" style="display:none;"></div>
    </div>
  `;

  window.scrollTo(0, 0);

  // Generate TOC from headings
  generateTOC(md);

  // Store current note md for mind map rendering
  window._currentNoteMd = md;
  window._mindmapRendered = false;
}

// Generate table of contents from markdown headings
function generateTOC(mdContent) {
  const headingRegex = /^(#{1,6})\s+(.+)$/gm;
  const headings = [];
  let match;

  while ((match = headingRegex.exec(mdContent)) !== null) {
    const level = match[1].length;
    const text = match[2].trim();
    headings.push({ level, text });
  }

  const tocList = document.getElementById("tocList");
  tocList.innerHTML = "";

  headings.forEach((heading, index) => {
    const li = document.createElement("li");
    li.className = "toc-item";

    const a = document.createElement("a");
    a.className = `toc-link toc-level-${heading.level}`;
    a.textContent = heading.text;
    a.href = `#heading-${index}`;
    a.onclick = (e) => {
      e.preventDefault();
      const target = document.getElementById(`heading-${index}`);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        updateActiveTOC();
      }
    };

    li.appendChild(a);
    tocList.appendChild(li);
  });

  // Update active TOC item on scroll
  document.getElementById("main").addEventListener("scroll", updateActiveTOC);
}

// Update active TOC item based on current scroll position
function updateActiveTOC() {
  const headings = document.querySelectorAll("[id^='heading-']");
  const tocLinks = document.querySelectorAll(".toc-link");

  tocLinks.forEach(link => link.classList.remove("active"));

  let activeIndex = 0;
  for (let i = headings.length - 1; i >= 0; i--) {
    const heading = headings[i];
    if (heading.getBoundingClientRect().top <= 100) {
      activeIndex = i;
      break;
    }
  }

  if (tocLinks[activeIndex]) {
    tocLinks[activeIndex].classList.add("active");
  }
}

function toggleMindMap() {
  const wrap   = document.getElementById("mindmap-wrap");
  const btn    = document.getElementById("mindmap-toggle");
  const hidden = wrap.style.display === "none";

  if (hidden) {
    wrap.style.display = "block";
    btn.textContent = "收起心智圖";
    if (!window._mindmapRendered) {
      renderMindMap(window._currentNoteMd, wrap);
      window._mindmapRendered = true;
    }
  } else {
    wrap.style.display = "none";
    btn.textContent = "展開心智圖";
  }
}

function renderMindMap(mdContent, container) {
  // Extract only headings for a clean mind map
  const headingLines = mdContent.split("\n")
    .filter(l => /^#{1,4}\s/.test(l.trim()))
    .join("\n");

  const { Transformer } = window.markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(headingLines || mdContent);

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.style.cssText = "width:100%;height:520px;";
  container.innerHTML = "";
  container.appendChild(svg);

  const { Markmap } = window.markmap;
  const mm = Markmap.create(svg, {
    duration: 400,
    maxWidth: 260,
    paddingX: 16,
    spacingVertical: 8,
    spacingHorizontal: 80,
  });
  mm.setData(root);
  mm.fit();
}

// ── Init ──
buildSidebar();

// Auto-open first subject and load first note
if (SIDEBAR_DATA.length > 0) {
  toggleSubject(SIDEBAR_DATA[0].id);

  // Auto-expand all categories in the education subject
  const educationSubj = SIDEBAR_DATA.find(s => s.id === "education");
  if (educationSubj && educationSubj.categories) {
    educationSubj.categories.forEach(cat => {
      const catNotes = document.getElementById(`cat-${cat.id}`);
      const toggle = document.querySelector(`#cat-${cat.id}`).previousElementSibling?.querySelector(".category-toggle");
      if (catNotes) catNotes.classList.add("open");
      if (toggle) toggle.textContent = "▼";
    });
  }
}
if (FIRST_NOTE) {
  // Find first note in either direct notes or nested categories
  let foundNote = null;
  let foundSubj = null;

  for (const subj of SIDEBAR_DATA) {
    if (subj.notes && subj.notes.some(n => n.filename === FIRST_NOTE)) {
      foundNote = subj.notes.find(n => n.filename === FIRST_NOTE);
      foundSubj = subj;
      break;
    }
    if (subj.categories) {
      for (const cat of subj.categories) {
        if (cat.notes && cat.notes.some(n => n.filename === FIRST_NOTE)) {
          foundNote = cat.notes.find(n => n.filename === FIRST_NOTE);
          foundSubj = subj;
          break;
        }
      }
      if (foundNote) break;
    }
  }

  if (foundNote && foundSubj) {
    toggleSubject(foundSubj.id);
    loadNote(FIRST_NOTE, foundSubj.id, foundSubj.name);
  }
}
</script>
